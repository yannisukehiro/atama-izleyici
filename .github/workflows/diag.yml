name: Teshis
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Incelenecek adres"
        default: "https://kariyerkapisi.gov.tr/isealim"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python diag.py "${{ github.event.inputs.url }}"
